services:
  influxdb:
    image: influxdb:2.7
    container_name: qqq_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-stocks}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-qqq}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-qqq-stock-token-change-me}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  collector:
    build: ./collector
    container_name: qqq_collector
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-qqq-stock-token-change-me}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-stocks}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-qqq}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
    restart: unless-stopped

volumes:
  influxdb_data:
  influxdb_config:
